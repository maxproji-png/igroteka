* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: 'Nunito', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif; color: #2b2d42; user-select: none; -webkit-user-select: none;
  background: radial-gradient(120% 60% at 0% 0%, #ffe9f1 0%, transparent 60%), radial-gradient(120% 60% at 100% 100%, #e3f1ff 0%, transparent 60%), #fbf7ff; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
:root { --x: #ff8a3d; --xd: #e2621a; --o: #27bf8e; --od: #12996e; --ink: #2b2d42; --mut: #8a8da6; --card: #fff; --sh: 0 10px 30px rgba(84, 70, 160, .12), 0 2px 6px rgba(84, 70, 160, .08); --vio: #7c5cff; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; overflow: clip; }
.deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.deco i { position: absolute; border-radius: 50%; opacity: .55; filter: blur(.5px); animation: drift 14s ease-in-out infinite alternate; }
.deco i:nth-child(1) { width: 120px; height: 120px; left: -40px; top: 12%; background: #ffe0ef; }
.deco i:nth-child(2) { width: 80px; height: 80px; right: -20px; top: 6%; background: #dff0ff; animation-delay: -4s; }
.deco i:nth-child(3) { width: 150px; height: 150px; right: -60px; bottom: 18%; background: #e9e2ff; animation-delay: -7s; }
.deco i:nth-child(4) { width: 60px; height: 60px; left: 12%; bottom: 6%; background: #fff1cc; animation-delay: -2s; }
@keyframes drift { to { transform: translate(14px, -18px) scale(1.06); } }

.scr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  opacity: 0; pointer-events: none; transform: translateY(18px) scale(.985); transition: opacity .38s ease, transform .5s cubic-bezier(.2, .9, .3, 1.1); }
.scr.on { opacity: 1; pointer-events: auto; transform: none; }
.scr.out { opacity: 0; transform: translateY(-14px) scale(.985); }

.top { width: 100%; display: flex; align-items: center; justify-content: space-between; min-height: 46px; }
.ibtn { width: 46px; height: 46px; border-radius: 16px; background: #fff; box-shadow: var(--sh); display: grid; place-items: center; transition: transform .15s; }
.ibtn:active { transform: scale(.92); }
.ibtn svg { width: 22px; height: 22px; fill: none; stroke: #5b5f7e; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ibtn .off { display: none; } .muted .ibtn.snd .on1 { display: none; } .muted .ibtn.snd .off { display: inline; }
.stake { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; background: #fff; box-shadow: var(--sh); font-weight: 900; font-size: 16px; }
.stake .i-coin { width: 26px; height: 26px; }
.stake small { font-weight: 700; color: var(--mut); font-size: 14px; }

.btn { width: 100%; height: 60px; border-radius: 22px; font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .12s, box-shadow .12s; position: relative; }
.btn svg { width: 24px; height: 24px; }
.btn.pri { background: linear-gradient(180deg, #9b82ff, #7c5cff); color: #fff; box-shadow: 0 6px 0 #5d3fe0, 0 14px 24px rgba(124, 92, 255, .35); }
.btn.sec { background: #fff; color: var(--ink); box-shadow: 0 6px 0 #e4e0f5, 0 12px 22px rgba(84, 70, 160, .12); }
.btn.ghost { height: 50px; background: transparent; color: #6d7091; font-size: 18px; }
.btn:active { transform: translateY(4px); } .btn.pri:active { box-shadow: 0 2px 0 #5d3fe0, 0 6px 12px rgba(124, 92, 255, .3); } .btn.sec:active { box-shadow: 0 2px 0 #e4e0f5; }

/* ---- меню ---- */
.menu .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 0; }
.logo { display: flex; gap: 10px; margin-bottom: 6px; }
.logo .mk { width: 54px; height: 54px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.08)); animation: bob 2.4s ease-in-out infinite; }
.logo .mk:nth-child(2) { animation-delay: -.8s; } .logo .mk:nth-child(3) { animation-delay: -1.6s; }
h1 { margin: 6px 0 0; font-size: 38px; font-weight: 1000; letter-spacing: -.5px; line-height: 1; text-align: center; }
.blitz { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 14px 6px 10px; border-radius: 14px; background: #fff0c2; color: #b26a00; font-weight: 900; font-size: 15px; }
.blitz svg { width: 18px; height: 18px; }
.pick { margin-top: 22px; width: 100%; background: #fff; border-radius: 30px; box-shadow: var(--sh); padding: 16px 12px 14px; text-align: center; }
.pick .lbl { font-weight: 800; color: var(--mut); font-size: 14px; letter-spacing: .3px; }
.pets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.pp { border-radius: 20px; padding: 6px 0 6px; transition: background .2s, transform .15s; position: relative; }
.pp .pet { width: 100%; height: 74px; }
.pp span { display: block; font-weight: 800; font-size: 13px; color: var(--mut); margin-top: 2px; }
.pp.sel { background: #f1ecff; } .pp.sel span { color: var(--vio); }
.pp.sel::after { content: ''; position: absolute; inset: 0; border-radius: 20px; box-shadow: inset 0 0 0 2.5px #b9a6ff; }
.pp:active { transform: scale(.94); }
.pp.sel .pet { animation: hop .9s ease-in-out infinite; transform-origin: 50% 92%; }
.menu .acts { width: 100%; display: flex; flex-direction: column; gap: 14px; }

/* ---- питомцы ---- */
.pet .eh { display: none; } .pet.happy .eo { display: none; } .pet.happy .eh { display: inline; }
.bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 92%; }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(1.02, .98); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px) scale(.97, 1.04); } 55% { transform: translateY(0) scale(1.05, .95); } }
@keyframes jump { 0%, 100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-22px) scale(.96, 1.05) rotate(-3deg); } 60% { transform: translateY(0) scale(1.06, .94); } 75% { transform: translateY(-6px) rotate(2deg); } }

/* ---- правила ---- */
.rules .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
.vs { display: flex; align-items: flex-end; justify-content: center; gap: 14px; width: 100%; }
.vs .who { display: flex; flex-direction: column; align-items: center; width: 130px; }
.vs .who .pet { width: 120px; height: 124px; }
.vs .who b { font-size: 17px; font-weight: 900; margin-top: 2px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px 6px 8px; border-radius: 14px; background: #fff; box-shadow: var(--sh); font-weight: 900; font-size: 18px; }
.tchip .mk { width: 22px; height: 22px; }
.vs .vsl { font-weight: 1000; color: #c6c2dd; font-size: 22px; margin-bottom: 52px; }
.rcard { margin-top: 26px; background: #fff; border-radius: 28px; box-shadow: var(--sh); padding: 20px 20px; width: 100%; }
.rcard h2 { margin: 0 0 10px; font-size: 22px; font-weight: 1000; display: flex; align-items: center; gap: 8px; }
.rcard h2 svg { width: 24px; height: 24px; }
.rcard p { margin: 0; font-size: 17px; line-height: 1.38; font-weight: 700; color: #4a4d68; }
.rcard p + p { margin-top: 8px; }
.rcard b { color: var(--ink); font-weight: 900; }
.rules .acts { width: 100%; display: flex; flex-direction: column; gap: 6px; }

/* ---- игра ---- */
.game .players { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.pl { background: #fff; border-radius: 26px; box-shadow: var(--sh); padding: 12px 10px 12px; display: flex; flex-direction: column; align-items: center; position: relative; transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), opacity .3s, box-shadow .3s; opacity: .62; transform: scale(.96); }
.pl.act { opacity: 1; transform: scale(1); box-shadow: 0 0 0 3px var(--ac), 0 14px 30px rgba(84, 70, 160, .16); }
.pl.px { --ac: #ffc9a6; } .pl.po { --ac: #a9ead3; }
.pl .av { position: relative; width: 84px; height: 84px; }
.pl .av .pet { width: 84px; height: 84px; object-fit: contain; object-position: center bottom; }
.pl.act .av .pet { animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 92%; }
.pl .side { position: absolute; right: -20px; bottom: 0; width: 32px; height: 32px; border-radius: 12px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.12); display: grid; place-items: center; }
.pl .side .mk { width: 20px; height: 20px; }
.pl .nm { font-weight: 900; font-size: 16px; margin-top: 4px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { margin-top: 8px; width: 100%; height: 44px; border-radius: 16px; background: #f4f2fb; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 1000; font-size: 22px; font-variant-numeric: tabular-nums; }
.clock .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; background: #e9e5f7; }
.pl.act .clock .bar { background: var(--ac); }
.clock .t, .clock svg { position: relative; }
.clock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.clock small { font-size: 15px; font-weight: 900; opacity: .6; position: relative; }
.pl.act.low .clock { color: #e5383b; animation: pulse .5s ease-in-out infinite alternate; }
.pl.act.low .clock .bar { background: #ffc2c4; }
@keyframes pulse { to { transform: scale(1.05); } }
.turnbar { margin: 16px 0 0; height: 30px; font-weight: 900; font-size: 20px; text-align: center; transition: color .3s; }
.turnbar.tx { color: var(--xd); } .turnbar.to { color: var(--od); }
.boardw { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
.board { position: relative; width: min(100%, 360px, calc(100vh - 380px)); min-width: 250px; aspect-ratio: 1; background: #fff; border-radius: 34px; box-shadow: 0 18px 40px rgba(84, 70, 160, .14), 0 3px 8px rgba(84, 70, 160, .06); padding: 14px; transition: transform .55s cubic-bezier(.2, 1.3, .4, 1), opacity .4s; }
.board.intro { transform: scale(.7) rotate(-4deg); opacity: 0; }

.board.ready .grid line { stroke-dashoffset: 0; }
.board.ready .grid line:nth-child(2) { transition-delay: .08s; } .board.ready .grid line:nth-child(3) { transition-delay: .16s; } .board.ready .grid line:nth-child(4) { transition-delay: .24s; }
.cells { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; }
.cell { position: relative; display: grid; place-items: center; }
.cell .mk { width: 64%; height: 64%; overflow: visible; }
.cell.can:hover::before { content: ''; position: absolute; inset: 18%; border-radius: 50%; background: rgba(124, 92, 255, .05); }
.mk path, .mk circle { fill: none; stroke-linecap: round; }
.mk.x path { stroke: var(--x); stroke-width: 7; } .mk.o circle { stroke: var(--o); stroke-width: 7; }
.cell .mk.x path { stroke-width: 6.5; } .cell .mk.o circle { stroke-width: 6.5; }
.mk .sh { opacity: .16; transform: translate(0, 2.2px); }
.mk.x .sh { stroke: var(--xd) !important; } .mk.o .sh { stroke: var(--od) !important; }
.cell .mk.new { animation: pop .42s cubic-bezier(.2, 1.6, .4, 1); }
.cell .mk.new path:not(.sh), .cell .mk.new circle:not(.sh) { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .3s ease-out forwards; }
.cell .mk.new path:nth-of-type(4) { animation-delay: .1s; }
@keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cell.win .mk { animation: winp .6s .25s ease-in-out 2 alternate; }
@keyframes winp { to { transform: scale(1.14); } }
.cell.dim .mk { opacity: .28; transition: opacity .4s .3s; }
.cell.shake { animation: shake .36s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.wline { position: absolute; inset: 14px; pointer-events: none; overflow: visible; }
.wline line { stroke-width: 9; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .45s .1s ease-out forwards; }
.hint { min-height: 22px; margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--mut); text-align: center; }

.banner.show { animation: ban 1.1s cubic-bezier(.2, 1.3, .4, 1) forwards; }
.banner.red { background: #ff5a5f; box-shadow: 0 12px 28px rgba(255, 90, 95, .35); }

<script>/* «Тапыши» — вся графика: питомцы, яйца, шапки, гербы, иконки. Чистый SVG, без внешних файлов. */
(function () {
  'use strict';
  var n = 0;
  function uid(p) { return (p || 'g') + (++n).toString(36); }
  function lin(id, c1, c2, x2, y2) {
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + (x2 == null ? 0 : x2) + '" y2="' + (y2 == null ? 1 : y2) + '"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient>';
  }
  function rad(id, c1, c2, cx, cy) {
    return '<radialGradient id="' + id + '" cx="' + (cx || .38) + '" cy="' + (cy || .3) + '" r=".8"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></radialGradient>';
  }
  // глаза: open (.eo) и «счастливые» дуги (.eh) — переключаются классом .happy
  // EYE — параметры глаз для стадий взросления (размер, «уверенные» веки); задаёт growPet() на время отрисовки
  var EYE = null;
  function eyes(x1, x2, y, r, kind, o) {
    o = o || {};
    var E = EYE || {}; r = r * (E.s || 1);
    var open = '', happy = '', hs = o.happyStroke || '#2a2c3a', lids = '';
    [x1, x2].forEach(function (x) {
      if (E.lid && E.lidColor && kind !== 'sleepy') {
        var cid = uid('lc'), inner = x < 100 ? 1 : -1, yo = y - r + 2 * r * E.lid * .55, yi = y - r + 2 * r * E.lid * 1.25;
        lids += '<clipPath id="' + cid + '"><circle cx="' + x + '" cy="' + y + '" r="' + (r + .5) + '"/></clipPath><g clip-path="url(#' + cid + ')"><path d="M' + (x - r - 2) + ' ' + (y - r - 3) + ' H' + (x + r + 2) + ' V' + (inner > 0 ? yi : yo) + ' L' + (x - r - 2) + ' ' + (inner > 0 ? yo : yi) + 'Z" fill="' + E.lidColor + '"/></g>' +
          '<path d="M' + (x - r - 1) + ' ' + (inner > 0 ? yo : yi) + ' L' + (x + r + 1) + ' ' + (inner > 0 ? yi : yo) + '" stroke="' + (E.lineColor || '#1e2030') + '" stroke-width="' + (r * .32) + '" stroke-linecap="round"/>';
      }
      if (kind === 'white') {
        open += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff"/>' +
          '<circle cx="' + (x + r * .08) + '" cy="' + (y + r * .12) + '" r="' + (r * .74) + '" fill="#1e2030"/>';
      } else if (kind === 'iris') {
        open += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff"/>' +
          '<circle cx="' + (x + r * .06) + '" cy="' + (y + r * .1) + '" r="' + (r * .78) + '" fill="' + (o.iris || '#33c7c0') + '"/>' +
          '<circle cx="' + (x + r * .08) + '" cy="' + (y + r * .14) + '" r="' + (r * .46) + '" fill="#1b1533"/>';
      } else if (kind === 'sleepy') {
        open += '<path d="M' + (x - r) + ' ' + y + ' Q' + x + ' ' + (y + r * 1.5) + ' ' + (x + r) + ' ' + y + 'Z" fill="#2a1a10"/>' +
          '<path d="M' + (x - r - 2) + ' ' + y + ' L' + (x + r + 2) + ' ' + y + '" stroke="#5a341c" stroke-width="3.2" stroke-linecap="round"/>' +
          '<circle cx="' + (x - r * .25) + '" cy="' + (y + r * .45) + '" r="' + (r * .22) + '" fill="#fff" opacity=".85"/>';
      } else { // dot
        open += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#1e2030"/>';
      }
      if (kind !== 'sleepy') {
        open += '<circle cx="' + (x - r * .3) + '" cy="' + (y - r * .28) + '" r="' + (r * .34) + '" fill="#fff"/>' +
          '<circle cx="' + (x + r * .32) + '" cy="' + (y + r * .36) + '" r="' + (r * .15) + '" fill="#fff" opacity=".9"/>';
      }
      happy += '<path d="M' + (x - r * .95) + ' ' + (y + r * .25) + ' Q' + x + ' ' + (y - r * 1.05) + ' ' + (x + r * .95) + ' ' + (y + r * .25) + '" fill="none" stroke="' + hs + '" stroke-width="' + Math.max(3.4, r * .38) + '" stroke-linecap="round"/>';

  }
  function blush(x1, x2, y, c) {
    c = c || '#ff8fb0';
    return '<ellipse cx="' + x1 + '" cy="' + y + '" rx="10" ry="5.5" fill="' + c + '" opacity=".55"/><ellipse cx="' + x2 + '" cy="' + y + '" rx="10" ry="5.5" fill="' + c + '" opacity=".55"/>';
  }
  var shadow = '<ellipse cx="100" cy="197" rx="56" ry="8" fill="#1b0f4a" opacity=".2"/>';

  // ---------- ПИТОМЦЫ ----------
  // каждый: { svg(defsIds) -> {defs, back, body, head}, hat:{x,y,s}, eyes:[x1,x2,y] }
  var PETS = {};

  PETS.raccoon = function (o) {
    var g1 = uid('rb'), g2 = uid('rh'), grown = o.stage === 'grown';
    var defs = rad(g1, '#c5cad9', '#868ca3') + rad(g2, '#cfd3e0', '#8f95ab', .4, .25);
    // хвост
    var rings = [[146, 168, 19], [161, 152, 18], [172, 133, 17], [177, 112, 16], [175, 92, 14]];
    var tail = '';
    rings.forEach(function (r, i) { tail += '<ellipse cx="' + r[0] + '" cy="' + r[1] + '" rx="' + r[2] + '" ry="' + (r[2] * .92) + '" fill="' + (i % 2 ? '#3f4255' : '#adb2c4') + '"/>'; });
    tail += '<ellipse cx="171" cy="86" rx="6" ry="4" fill="#fff" opacity=".25"/>';
    var body =
      '<ellipse cx="78" cy="190" rx="16" ry="9" fill="#474b5e"/><ellipse cx="122" cy="190" rx="16" ry="9" fill="#474b5e"/>' +
      '<ellipse cx="100" cy="152" rx="47" ry="40" fill="url(#' + g1 + ')"/>' +
      '<ellipse cx="100" cy="161" rx="29" ry="26" fill="#f2f3f9"/>' +
      '<ellipse cx="59" cy="153" rx="11" ry="17" transform="rotate(28 59 153)" fill="#4e5266"/>' +
      '<ellipse cx="141" cy="153" rx="11" ry="17" transform="rotate(-28 141 153)" fill="#4e5266"/>';
    var head =
      '<path d="M50 80 C38 40 62 26 88 50 Z" fill="#8f95ab"/><path d="M57 71 C52 48 64 41 79 53 Z" fill="#ffadc4"/>' +
      '<path d="M150 80 C162 40 138 26 112 50 Z" fill="#8f95ab"/><path d="M143 71 C148 48 136 41 121 53 Z" fill="#ffadc4"/>' +
      '<ellipse cx="100" cy="95" rx="60" ry="50" fill="url(#' + g2 + ')"/>' +
      '<path d="M41 100 L30 92 L42 110 L32 112 L48 120 Z" fill="#a4a9bb"/><path d="M159 100 L170 92 L158 110 L168 112 L152 120 Z" fill="#a4a9bb"/>' +
      '<path d="M52 108 Q100 74 148 108 Q142 145 100 145 Q58 145 52 108Z" fill="#f4f5fa"/>' +
      '<path d="M100 46 Q111 66 105 86 L95 86 Q89 66 100 46Z" fill="#5b6075"/>' +
      '<path d="M43 93 Q58 70 88 84 Q100 92 112 84 Q142 70 157 93 Q151 116 124 111 Q108 107 100 100 Q92 107 76 111 Q49 116 43 93Z" fill="#363a4c"/>' +
      eyes(76, 124, 94, grown ? 10 : 11.5, 'white', { happyStroke: '#fff' }) +
      (grown ? '<path d="M62 76 Q76 70 90 80" stroke="#22243a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M138 76 Q124 70 110 80" stroke="#22243a" stroke-width="5" fill="none" stroke-linecap="round"/>' : '') +
      '<ellipse cx="100" cy="115" rx="8.5" ry="6" fill="#2a2c38"/><ellipse cx="97" cy="113" rx="3" ry="1.6" fill="#fff" opacity=".7"/>' +
      (grown ? '<path d="M88 124 Q100 132 114 121" stroke="#2a2c38" stroke-width="3.2" fill="none" stroke-linecap="round"/>'
             : '<path d="M89 122 Q94.5 128.5 100 122 Q105.5 128.5 111 122" stroke="#2a2c38" stroke-width="3" fill="none" stroke-linecap="round"/>') +
