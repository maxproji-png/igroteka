<title>render stages</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<style>
  html,body{margin:0;background:transparent}
  #box{width:512px;height:512px;background:transparent;position:relative}
  canvas{width:512px;height:512px;display:block;background:transparent}
</style>
<div id="box"><canvas id="c" width="512" height="512"></canvas></div>
<script type="module">
import { petStage } from '../pet/stage.js?v=tc11141700';
const q = new URLSearchParams(location.search);
const pet = q.get('pet') || 'raccoon';
const stage = Math.max(1, Math.min(6, +(q.get('stage') || 1)));
const canvas = document.getElementById('c');
await petStage({
  canvas, pet, stage, yaw: 0.38, f: 0.46, cy: 0.46, cx: 0.5,
  fit: 'app', padTop: 6, padBottom: 4, petInput: false
});
// дать кадру и теням дорисоваться
await new Promise(r => setTimeout(r, 280));
document.documentElement.dataset.ready = '1';
window.__ready = true;
</script>
