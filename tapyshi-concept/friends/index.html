<!DOCTYPE html>
<html lang="ru" data-root="../" data-tab="games">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тапыши · Друзья</title>
<link rel="stylesheet" href="../games/shared/tokens.css?v=tc11152130">
<link rel="stylesheet" href="../games/shared/components.css?v=tc11152130">
<link rel="stylesheet" href="../games/catalog-a/style.css?v=tc11141101">
<link rel="stylesheet" href="../games/shared/screens.css?v=tc11141101">
<link rel="stylesheet" href="variants.css?v=tc11152130">
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var fv = (q.get('fv') || '').toLowerCase();
  var empty = q.get('empty') === '1';
  if(fv !== 'a' && fv !== 'b' && fv !== 'c'){
    if(!empty){
      location.replace('variants.html?v=tc11152130');
      return;
    }
    fv = 'b';
  }
  window.TAP_PROTO = 1;
  window.TAP_BASE = '../games/shared/';
  window.TAP_OPEN_FRIENDS = true;
  window.TAP_FRIENDS_EMPTY = empty;
  window.TAP_FV = fv;
  var ev = (q.get('ev') || '').toLowerCase();
  if(ev === 'a' || ev === 'b') window.TAP_EV = ev;
})();
</script>
<script src="../games/shared/games.js?v=tc11141101"></script>
<script src="../games/shared/screens.js?v=tc11152130"></script>
<script src="../shared/nav.js?v=tc11141101"></script>
<script src="../shared/invite.js?v=tc11141101"></script>
<script src="../games/proto.js?v=tc11152130"></script>
</body>
</html>
