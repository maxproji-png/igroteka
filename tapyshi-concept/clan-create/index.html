<!DOCTYPE html>
<html lang="ru" data-root="../" data-tab="clan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Тапыши · Создать клан</title>
<link rel="stylesheet" href="../shared/tokens.css?v=tc11132356">
<link rel="stylesheet" href="../shared/components.css?v=tc11132356">
<link rel="stylesheet" href="shared.css?v=tc11132356">
</head>
<body>
<div class="app" id="app">
  <div class="scroll">
    <header class="top">
      <a class="ibtn spring" href="../clan/?empty=1" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></a>
      <span class="ttl"><b>Создать клан</b></span>
    </header>

    <div class="preview-hero" id="hero"></div>

    <label class="lab" for="name">Название</label>
    <input class="field" id="name" type="text" maxlength="18" placeholder="Название клана" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
    <div class="hint" id="hint"></div>

    <div class="lab">Герб</div>
    <div class="crest-grid" id="crests"></div>

    <div class="lab">Цвет клана</div>
    <div class="color-grid" id="colors"></div>
  </div>
  <div class="dock"><button type="button" class="btn btn--primary btn--l" id="create" disabled>Создать</button></div>
</div>
<script src="shared.js?v=tc11132356"></script>
<script>
ClanCreate.init({
  preview:[{el:'#hero',kind:'hero'}],
  nameInput:'#name', crests:'#crests', colors:'#colors', create:'#create', hint:'#hint',
  afterCreate:'../clan/?mine=1'
});
</script>
<script src="../shared/nav.js?v=tc11132356"></script>
</body>
</html>
