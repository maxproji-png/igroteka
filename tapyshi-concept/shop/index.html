<!DOCTYPE html>
<html lang="ru" data-root="../" data-tab="shop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Тапыши · Магазин закрыт</title>
<link rel="stylesheet" href="../shared-clan/css/styles.css?v=tc11132240">
<link rel="stylesheet" href="../shared-clan/css/v2.css?v=tc11132240">
<link rel="stylesheet" href="../shared-clan/css/tokens.css?v=tc11132240">
<link rel="stylesheet" href="../shared/components.css?v=tc11132240">
<style>
/* Заглушка «Магазин закрыт». Цвета — только токены из ../shared/css/tokens.css (= 2-games/shared/tokens.css). */
.hd{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.hd b{font-size:28px;font-weight:1000;letter-spacing:-.5px}
.hd .coins{height:40px}
.mid{position:absolute;left:24px;right:24px;top:calc(50% - var(--nav-h)/2 - 8px);transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
.stage{position:relative;width:220px;height:220px}
.stage .disc{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--white),var(--violet-soft) 70%);box-shadow:inset 0 -8px 0 color-mix(in srgb,var(--violet) 8%,transparent)}
.stage .pet{position:absolute;left:50%;bottom:16px;width:178px;margin-left:-89px;filter:drop-shadow(0 8px 10px rgb(var(--shade) / .18));animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
.stage .zz{position:absolute;right:30px;top:26px;font-size:22px;font-weight:1000;color:var(--violet);opacity:.0;animation:zz 3.2s ease-in-out infinite}
.stage .zz:nth-of-type(2){right:14px;top:6px;font-size:16px;animation-delay:1.1s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:.85}100%{opacity:0;transform:translate(8px,-14px)}}
.sign{position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(-4deg);display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-pill);
  background:var(--white);color:var(--violet);font-size:14px;font-weight:1000;box-shadow:0 4px 12px rgb(var(--shade) / .14);white-space:nowrap;animation:swing 4s ease-in-out infinite;transform-origin:50% -20px}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(3deg)}}
.sign svg{width:16px;height:16px}
h1{margin:18px 0 0;font-size:28px;font-weight:1000;letter-spacing:-.4px}
.mid p{margin:8px 0 0;max-width:290px;font-size:15px;line-height:1.4;font-weight:700;color:var(--ink-2)}
.soon{margin-top:16px}
.btn--secondary{margin-top:22px}
.btn--secondary.done{color:var(--green-edge)}
@media (max-height:760px){.stage{width:180px;height:180px}.stage .pet{width:146px;margin-left:-73px;bottom:12px}h1{font-size:25px;margin-top:14px}.mid p{font-size:14px}.btn--secondary{margin-top:18px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hd"><b>Магазин</b><span class="coins tap" id="bal"></span></header>
  <section class="mid">
    <div class="stage"><i class="disc"></i><img class="pet" src="../shared-clan/img/pets/capybara_neutral.webp" alt=""><span class="zz">z</span><span class="zz">z</span><span class="sign" id="sign"></span></div>
    <h1>Магазин закрыт</h1>
    <p>Капибара раскладывает товары по полкам. Загляни чуть позже!</p>
    <span class="chip chip--violet chip--m soon" id="soon"></span>
    <button class="btn btn--secondary btn--m tap" id="notify"></button>
  </section>
  </div>
<script>window.T={ROOT:'../shared-clan/'}</script>
<script src="../shared-clan/js/data.js?v=tc11132240"></script>
<script src="../shared-clan/js/app.js?v=tc11132240"></script>
<script src="../shared-clan/js/v2.js?v=tc11132240"></script>
<script src="../shared-clan/js/nav3.js?v=tc11132240"></script>
<script>
var bell='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.5 15.5A1 1 0 0 0 5.4 17h13.2a1 1 0 0 0 .9-1.5L18 12.6V9a6 6 0 0 0-6-6z"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0z"/></svg>';
var star='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>';
document.getElementById('bal').innerHTML=T.coin()+'<span class="num">12&nbsp;000</span>';
document.getElementById('sign').innerHTML=T.IC.clock+'Скоро откроемся';
document.getElementById('soon').innerHTML=star+'Скоро: скины, иконки, цвета ника';
var n=document.getElementById('notify');n.innerHTML=bell+'Сообщить об открытии';
n.addEventListener('click',function(){n.classList.add('done');n.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>Напомним в MAX';});
</script>
<script src="../shared/nav.js?v=tc11132240"></script>
</body>
</html>
