*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:var(--bg);overflow:hidden}

.pet-sil.is-covered{opacity:0;transition:opacity .28s ease}
.pet-standin{position:absolute;left:50%;bottom:calc(var(--tabbar-space) + 86px);width:268px;height:auto;object-fit:contain;transform:translateX(-50%);z-index:1;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .28s ease;filter:drop-shadow(0 22px 16px rgb(50 70 130 / .28))}

.pet-standin.is-empty,.pet-standin.is-spent,.pet-standin:not([src]){opacity:0!important;visibility:hidden}
.pet-load{position:absolute;left:0;right:0;top:80px;bottom:calc(var(--tabbar-space) + 90px);z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;opacity:0;visibility:hidden;--pc:0%;font-family:ui-rounded,system-ui,sans-serif}
.pet-load.on{opacity:1;visibility:visible}
.pet-load.out{opacity:0;transition:opacity .28s ease}
.pet-load-sh{position:absolute;left:50%;bottom:16%;width:44%;height:9%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgb(40 30 90 / .16),rgb(40 30 90 / 0))}

.pet-load-bar>i{display:block;height:100%;width:var(--pc,0%);border-radius:2px;background:var(--violet);transition:width .2s linear}

<script>
/* Выбор питомца/стадии до первой отрисовки. Единственный источник: window.__resolvePetStart / window.__pet.
   core.js и сцена читают этот же результат. Не зашивать src постера в разметку. */
(function (w, d) {
  var PETS = { raccoon: 1, capybara: 1, dragon: 1, goose: 1 };
  var STAGE_AT = [1, 5, 10, 15, 20, 25];
  var LEVEL_MIN = 1, LEVEL_MAX = 30;
  function validPet(id) { return !!PETS[id]; }
  function validStage(s) { s = s | 0; return s >= 1 && s <= 6; }
  function validLevel(l) { l = l | 0; return l >= LEVEL_MIN && l <= LEVEL_MAX; }
  function stageOf(level) {
    var lv = Math.max(LEVEL_MIN, Math.floor(level) || 1), i;
    for (i = STAGE_AT.length - 1; i >= 0; i--) if (lv >= STAGE_AT[i]) return i + 1;
    return 1;
  }
  function firstLevelOf(stage) { return STAGE_AT[Math.max(0, Math.min(5, (stage | 0) - 1))]; }
  function posterUrl(pet, stage) {
    var root = (d.documentElement.dataset.root || './').replace(/\/?$/, '/');

    var known = true, pet = null, level = null;
    if (q.has('pet')) {
      if (!validPet(q.get('pet'))) known = false;
      else pet = q.get('pet');
    }
    if (q.has('level')) {
      if (!validLevel(q.get('level'))) known = false;
      else level = q.get('level') | 0;
    } else if (q.has('stage')) {
      if (!validStage(q.get('stage'))) known = false;
      else level = firstLevelOf(q.get('stage') | 0);
    }
    if (known && !pet && fresh) {
      var s = readStore('session', 'tapyshi.start');
      if (s && s.fresh && validPet(s.pet)) pet = s.pet;
    }
    if (known && !fresh) {
      var h = readStore('local', 'tapyshi.home');
      if (h) {
        if (!pet && validPet(h.pet)) pet = h.pet;
        if (level == null && validLevel(h.level)) level = h.level | 0;
      }
    }
    if (!known) return { fresh: fresh, pet: null, level: null, stage: null, known: false, src: '', resolved: true };
    if (!pet) pet = 'raccoon';
    if (level == null) level = fresh ? 1 : 7;
    var stage = stageOf(level);
    if (!validPet(pet) || !validStage(stage)) {
      return { fresh: fresh, pet: null, level: null, stage: null, known: false, src: '', resolved: true };
    }
    return { fresh: fresh, pet: pet, level: level, stage: stage, known: true, src: posterUrl(pet, stage), resolved: true };
  }
  var r = resolve();
  w.__resolvePetStart = resolve;
  w.__pet = r;
  if (r.src) {
    var link = d.createElement('link');
    link.id = 'petStandinPreload';
    link.rel = 'preload';
    link.as = 'image';
    link.href = r.src;
    d.head.appendChild(link);
  }
  /* Постер — только после load+decode, иначе прогрессивный PNG даёт «кончики ушей».
     Идемпотентно: уже показанный тот же src не сбрасываем и не ждём повторный load.
     decode() с таймаутом; при ошибке/зависании, если байты есть, всё равно показываем. */
  w.__petBootAt = performance.now();
  var POSTER_DECODE_MS = 2000;
  /* Постер не complete дольше этого — считаем сетью (долгий TTFB, записи в Resource Timing ещё нет).
     800 мс: холодный Slow 4G (RTT 400) успевает отличиться, тёплый кэш даже при CPU 4x обычно complete раньше. */
  var POSTER_NET_MS = 800;
  var CODE_RE = /\.(glb|js|mjs|wasm)(\?|$)/i;
  var ASSET_RE = /\.(glb|js|mjs|wasm|png|jpe?g|webp|gif|css|woff2?)(\?|$)/i;
  function entryFromNet(e) {
    var body = e.decodedBodySize || e.encodedBodySize || 0;
    if (e.transferSize > 0 && (body === 0 || e.transferSize >= Math.max(400, body * 0.4))) return true;
    if (!e.responseEnd) {

      var started = e.startTime || 0;
      var rs = e.responseStart || 0;

      if (rs && ttfb >= 80) return true;

      var list = performance.getEntriesByType('resource');
      for (var i = 0; i < list.length; i++) {

      }
      if (codeOnly) return false;
      /* нет записи в Resource Timing (запрос ещё в TTFB): постер запрошен, байтов нет дольше N мс.
         Если запись уже есть и тело из кэша (transferSize=0) — это медленный decode (CPU 4x), не сеть. */
      var img = d.getElementById('petStandin');
      if (img && img.getAttribute('src') && !(img.complete && img.naturalWidth)) {
        var src = img.currentSrc || img.src || '';
        var cached = false;
        for (var j = 0; j < list.length; j++) {
          var pe = list[j], pn = String(pe.name || '');
          if (src && pn !== src && pn.indexOf(src.replace(/^\.\//, '')) < 0 && !/pets\/stage\//.test(pn)) continue;
          if (!/\.(png|jpe?g|webp|gif)(\?|$)/i.test(pn)) continue;
          if (pe.responseEnd && !(pe.transferSize > 0 && (pe.decodedBodySize || pe.encodedBodySize || 0) && pe.transferSize >= Math.max(400, (pe.decodedBodySize || pe.encodedBodySize) * 0.4))) {
            cached = true; break;
          }
        }
        if (cached) return false;
        var tSrc = typeof w.__petPosterSrcAt === 'number' ? w.__petPosterSrcAt : w.__petBootAt;
        if (performance.now() - tSrc >= POSTER_NET_MS) return true;
      }
    } catch (err) {}
    return false;
  };
  w.__petNetProgress = function () {
    /* доля по байтам постера и модулей, только растёт снаружи (вызывающий сам хранит last). */
    var got = 0, tot = 0, hasGlb = false, hasPoster = false;
    try {
      var list = performance.getEntriesByType('resource');
      for (var i = 0; i < list.length; i++) {
        var e = list[i], n = String(e.name || '');
        var isGlb = /\.glb(\?|$)/i.test(n);
        var isCode = /three\.module|GLTFLoader|stage3d|addons|evo|core\.js|fx\.js/i.test(n) || isGlb;
        var isPoster = /\.(png|jpe?g|webp|gif)(\?|$)/i.test(n) && /pets\/stage|pet_standin|standin/i.test(n);
        if (!isCode && !isPoster && !/\/pet\/.*\.(js|mjs)(\?|$)/i.test(n)) continue;
        if (isPoster) hasPoster = true;
        if (isGlb) hasGlb = true;
        var enc = e.encodedBodySize || e.decodedBodySize || 0;
        if (e.responseEnd) {
          var sz = enc || e.transferSize || 0;
          got += sz; tot += sz;
        } else {
          got += e.transferSize || 0;
          tot += Math.max(enc, e.transferSize || 0, isPoster ? 80000 : (/three\.module/i.test(n) ? 655000 : (/GLTFLoader/i.test(n) ? 30000 : 0)));
        }
      }
    } catch (err) {}
    if (tot <= 0) return 0;
    var cap = hasGlb ? 89 : (hasPoster ? 90 : 55);
    return Math.max(0, Math.min(cap, Math.floor(100 * got / tot)));
  };
  function coverSil(on) {
    var sil = d.getElementById('petSil');
    if (sil) sil.classList.toggle('is-covered', !!on);
  }
  function revealPoster(img, src, onReady, onNeedLoader) {
    return new Promise(function (resolve) {
      var settled = false;
      function done(ok) {

      }
      function ready() {
        if (!img) return done(false);
        img.classList.add('is-decoded');
        img.classList.remove('is-empty', 'is-spent');
        img.hidden = false;

        coverSil(true);
        if (w.__petBootLoaderTimer) { clearTimeout(w.__petBootLoaderTimer); w.__petBootLoaderTimer = 0; }
        if (typeof w.__onPetPosterReady === 'function') w.__onPetPosterReady();
        done(true);
      }
      function fail() {
        /* байтов нет — силуэт остаётся, лоадер не держим вечно (это решит ready/таймер) */
        if (img) {
          img.classList.remove('is-decoded');
          img.style.visibility = '';
        }
        w.__petPosterReady = false;
        coverSil(false);
        done(false);
      }
      function afterBytes() {
        if (!(img && img.complete && img.naturalWidth)) return fail();
        if (typeof img.decode !== 'function') return ready();
        var to = setTimeout(function () { ready(); }, POSTER_DECODE_MS);
        try {
          img.decode().then(function () { clearTimeout(to); ready(); }, function () { clearTimeout(to); ready(); });
        } catch (e) { clearTimeout(to); ready(); }
      }
      if (!img) return done(false);
      if (!src) return fail();
      img.hidden = false;
      img.classList.remove('is-empty', 'is-spent');
      var same = img.getAttribute('src') === src;
      if (same && img.complete && img.naturalWidth) {
        /* уже есть байты: не трогаем src, не прячем, не ждём повторный load */
        if (img.classList.contains('is-decoded')) return ready();
        return afterBytes();
      }
      if (!same) {

        w.__petPosterSrcAt = w.__petBootAt;
      }
      if (img.complete && img.naturalWidth) afterBytes();
      else {
        /* сетевую загрузку не обрываем по таймауту decode — ждём load/error */

<span aria-hidden="true" style="position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Тапыши</span>
<div class="app">
  <div id="petBoot">
    <span class="pet-sil" id="petSil" aria-hidden="true">
      <svg viewBox="0 0 268 300" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <ellipse cx="134" cy="286" rx="70" ry="12" fill="rgb(80 62 160 / .10)"/>
        <rect x="64" y="118" width="140" height="150" rx="48" fill="#D8D0F0"/>
        <rect x="74" y="36" width="120" height="112" rx="44" fill="#E3DCF6"/>
        <circle cx="114" cy="92" r="7" fill="#C4BCD8"/>
        <circle cx="154" cy="92" r="7" fill="#C4BCD8"/>
      </svg>
    </span>
    <img class="pet-standin is-empty" id="petStandin" alt="" width="256" height="256" draggable="false" decoding="async">
    <span class="pet-load" id="petLoad" aria-live="polite" aria-label="Загружаем"><i class="pet-load-sh"></i><i class="pet-load-r"></i><b>Загружаем<span class="pet-load-pc"></span></b><i class="pet-load-bar"><i></i></i></span>
  </div>
  <script>
  (function () {
    var el = document.getElementById('petStandin');
    var load = document.getElementById('petLoad');
    var boot = document.getElementById('petBoot');
    var p = window.__pet;
    var BOOT_LOADER_MS = 300;
    var POSTER_NET_MS = 800;
    var bootPc = -1;
    function posterHasBytes() {
      return !!(el && el.complete && el.naturalWidth);
    }
    function applyBootPc(pc) {
      if (!load || !load.classList.contains('on') || load.classList.contains('out')) return;
      pc = Math.max(0, Math.min(100, pc | 0));
      if (pc < bootPc) return;
      bootPc = pc;
      load.classList.add('has-pc');
      load.style.setProperty('--pc', pc + '%');
      var lab = load.querySelector('.pet-load-pc');
      if (lab) lab.textContent = pc + '%';
      load.dataset.pc = String(pc);
    }
    function tickBootPc() {
      if (document.documentElement.dataset.pet === 'ready') return;
      if (typeof window.__petNetProgress === 'function') applyBootPc(window.__petNetProgress());
      window.__petBootPcTimer = setTimeout(tickBootPc, 200);
    }
    function showLoader() {
      if (document.documentElement.dataset.pet === 'ready') return;
      var posterUp = !!(window.__petPosterReady || posterHasBytes());
      var net = typeof window.__petNetLoading === 'function' && window.__petNetLoading(posterUp ? 'code' : undefined);
      if (!net) {
        /* постер запрошен, но записи Resource Timing ещё нет — проверим снова в N мс */
        if (!posterUp && el && el.getAttribute('src') && !posterHasBytes()) {
          var tSrc = window.__petPosterSrcAt || window.__petBootAt || 0;
          var left = POSTER_NET_MS - (performance.now() - tSrc);
          if (left < 0) left = 0;
          if (!window.__petBootLoaderRetry) {
            window.__petBootLoaderRetry = 1;
            window.__petBootLoaderTimer = setTimeout(showLoader, left + 16);
          }
        }
        return;
      }
      if (load) load.classList.add('on');
      if (boot) boot.classList.add('has-loader');
      if (!window.__petLoaderShownAt) window.__petLoaderShownAt = performance.now();
      if (!window.__petBootPcTimer) tickBootPc();
    }
    /* С первого кадра только силуэт. «Загружаем» — если через 300 мс идёт сеть,
       или постер так и не complete спустя POSTER_NET_MS (долгий TTFB без записи timing). */
    window.__petBootLoaderTimer = setTimeout(showLoader, BOOT_LOADER_MS);
    if (window.__revealPetPoster && el && p && p.known && p.src) {
      window.__revealPetPoster(el, p.src);
    } else {
      if (el) { el.removeAttribute('src'); el.classList.add('is-empty'); el.hidden = true; }
    }
  })();
  </script>
