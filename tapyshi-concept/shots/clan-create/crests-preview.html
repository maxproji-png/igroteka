<!DOCTYPE html>
<html lang="ru"><head>

<title>Гербы · проверка</title>
<style>
  html,body{margin:0;background:#F4F0FF;color:#3A3358;font-family:Nunito,system-ui,sans-serif}
  h1{margin:0;padding:16px 20px 8px;font-size:22px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:12px 20px 24px}
  .card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 8px 24px rgb(80 62 160 / .12)}
  .zoom{width:160px;height:160px;margin:0 auto 12px;display:grid;place-items:center;border-radius:28px;background:#F8F7FF;position:relative}
  .zoom svg{width:132px;height:132px}
  .zoom.ink{color:#3A3358}
  .row{display:flex;gap:10px;justify-content:center;align-items:center}
  .badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff}
  .badge svg{width:36px;height:36px}
  .badge.v{background:linear-gradient(180deg,#9a84ff,#7C5CFF)}
  .badge.s{background:linear-gradient(180deg,#ffd56a,#FFC233);color:#3A3358}
  .badge.g{background:linear-gradient(180deg,#4ad09a,#26B880)}
  .sm{width:40px;height:40px;display:grid;place-items:center}
  .sm svg{width:28px;height:28px}
  figcaption{text-align:center;margin-top:10px;font-weight:800;font-size:14px}
  code{font-weight:700;color:#7E789E;font-size:12px}
  .zoom::before,.zoom::after{content:"";position:absolute;background:rgb(124 92 255 / .25);pointer-events:none}
  .zoom::before{left:50%;top:8px;bottom:8px;width:1px}
  .zoom::after{top:50%;left:8px;right:8px;height:1px}
</style>
