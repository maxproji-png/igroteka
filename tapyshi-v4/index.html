<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5a3cf0">
  <title>Тапыши · макет игротеки</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/Unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/tasks.css">
  <link rel="stylesheet" href="css/growth.css">
  <link rel="stylesheet" href="css/boost.css">
  <link rel="stylesheet" href="css/calm.css">
  <link rel="stylesheet" href="css/skins.css">
  <link rel="stylesheet" href="css/ttt.css">
  <link rel="stylesheet" href="css/v22.css">
  <link rel="stylesheet" href="css/v24.css">
  <link rel="stylesheet" href="css/v26.css">
  <link rel="stylesheet" href="css/port.css">
</head>
<body>
  <div id="app">
    <div class="bg-deco" aria-hidden="true"><i></i><i></i><i></i></div>
    <main id="screen">
      <section class="scr home on" id="scr-pet" data-tab="pet"></section>
      <section class="scr scroll clanscr" id="scr-clan" data-tab="clan"></section>
      <section class="scr gamescr" id="scr-games" data-tab="games">
        <div class="games-head">
          <h1>Игры <span class="proto">макет</span></h1>
          <div class="games-bal" id="gamesBal"></div>
        </div>
        <div id="hub">
          <div class="hub-top">
            <div class="hero">
              <div class="txt"><b>8 игр с&nbsp;питомцами</b><span>Енот, гусь, дракон и&nbsp;капибара уже ждут</span></div>
              <div class="squad" id="squad"></div>
            </div>
            <div class="pagebar">
              <h2 id="pageTitle">Страница 1<em>из 2</em></h2>
              <div class="arrows">
                <button class="arrow" id="prev" aria-label="Назад"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" stroke="#2A2D4B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <button class="arrow" id="next" aria-label="Вперёд"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" stroke="#2A2D4B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              </div>
            </div>
          </div>
          <div class="pages" id="pages"></div>
          <div class="dots" id="dots"></div>
          <div class="foot">Листай влево-вправо</div>
        </div>
      </section>
      <section class="scr scroll shopscr" id="scr-shop" data-tab="shop"></section>
    </main>
    <nav id="tabs" class="v2"></nav>
    <div id="layer"></div>
    <section id="game" class="glayer" aria-hidden="true">
      <div class="gwrap" id="gwrap"><div class="loader" id="loader"></div></div>
    </section>
    <div id="toast" role="status"></div>
    <div id="playSheet" class="psheet" aria-hidden="true">
      <div class="ps-dim" data-ps="dim"></div>
      <div class="ps-card" role="dialog" aria-modal="true" aria-labelledby="psTitle">
        <div class="ps-handle" data-ps="handle"><i></i></div>
        <div class="ps-view" data-view="modes" id="psModes"></div>
        <div class="ps-view ps-search" data-view="search" id="psSearch" hidden></div>
        <div class="ps-view ps-invite" data-view="invite" id="psInvite" hidden></div>
      </div>
    </div>
  </div>
  <script src="js/art.js"></script>
  <script src="js/pets-bridge.js"></script>
  <script src="js/hub-data.js"></script>
  <script src="js/port.js"></script>
</body>
</html>
