<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4fb">
<title>Сложи блоки</title>
<style>
:root{
  --font:'Comfortaa','Nunito','Quicksand','Varela Round',ui-rounded,'SF Pro Rounded','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --ink:#3a3560;--muted:#8a86a8;--card:#fff;--bg0:#fff4fb;--bg1:#eaf3ff;
  --shadow:0 2px 4px rgba(80,70,140,.05),0 10px 30px rgba(80,70,140,.12);
  --shadow-sm:0 1px 2px rgba(80,70,140,.06),0 4px 12px rgba(80,70,140,.10);
  --primary:#7c6cff;--primary2:#a08cff;
  --bs:360px;--cs:40px;--gap:4px;--pad:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 70% at 10% 0%,#ffe9f5 0%,rgba(255,233,245,0) 60%),radial-gradient(100% 60% at 100% 100%,#dff6ff 0%,rgba(223,246,255,0) 60%),linear-gradient(180deg,var(--bg0),var(--bg1));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-weight:700}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-weight:700;padding:0}
#app{position:relative;width:100%;max-width:520px;height:100%;margin:0 auto;overflow:hidden}
.bgdeco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bgdeco i{position:absolute;border-radius:28%;opacity:.35;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 8deg))}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.94);pointer-events:none;transition:opacity .38s ease,transform .45s cubic-bezier(.2,.9,.25,1.15);padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.screen.on{opacity:1;transform:none;pointer-events:auto}
.screen.out{opacity:0;transform:scale(1.05)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:340px;height:58px;border-radius:22px;font-size:19px;letter-spacing:.2px;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.primary{color:#fff;background:linear-gradient(180deg,#9d8cff,#6f5cf5);box-shadow:inset 0 -4px 0 rgba(40,20,140,.25),inset 0 2px 0 rgba(255,255,255,.35),0 8px 20px rgba(111,92,245,.35)}
.btn.green{color:#fff;background:linear-gradient(180deg,#5fe39a,#25c06a);box-shadow:inset 0 -4px 0 rgba(0,90,40,.22),inset 0 2px 0 rgba(255,255,255,.4),0 8px 20px rgba(37,192,106,.32)}
.btn.soft{background:#fff;box-shadow:var(--shadow-sm);color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:scale(.94)}

/* menu */
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;min-height:56px;flex:none}
.logo{margin-top:clamp(4px,2vh,22px);display:flex;flex-direction:column;align-items:center;gap:8px}
.logo .tiles{display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.logo .tiles span{width:22px;height:22px;font-size:22px}
.logo h1{margin:0;font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:-.5px;font-weight:700;background:linear-gradient(180deg,#8c78ff,#5d4be0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(93,75,224,.15))}
.menu-pet{position:relative;width:min(52vw,210px);aspect-ratio:200/206;margin-top:clamp(6px,2.5vh,26px);flex:none}
.menu-pet .pet{width:100%;height:100%;animation:idleBob 2.6s ease-in-out infinite}
.petname{margin-top:2px;font-size:18px;color:var(--ink)}
.picker-title{margin-top:clamp(8px,2vh,18px);font-size:13px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.picker{display:flex;gap:10px;margin-top:8px}
.picker button{width:64px;height:64px;border-radius:22px;background:#fff;box-shadow:var(--shadow-sm);padding:4px;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.picker button svg{width:100%;height:100%}
.picker button.sel{transform:translateY(-4px) scale(1.06);box-shadow:0 0 0 3px #a08cff,0 8px 18px rgba(124,108,255,.3)}
.bestline{margin-top:clamp(10px,2.4vh,22px);display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:10px 18px;box-shadow:var(--shadow-sm);font-size:16px}
.bestline b{font-size:18px;color:#ff8a3d}
.menu-btns{margin-top:auto;margin-bottom:max(22px,3vh);width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}

/* rules */
.rules-wrap{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:100%}
.rules-pet{width:min(44vw,170px);aspect-ratio:200/206}
.rules-pet .pet{width:100%;height:100%;animation:idleBob 2.4s ease-in-out infinite}
.rules-card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:22px 22px 24px;width:100%;max-width:360px;margin-top:6px}
.rules-card h2{margin:0 0 10px;font-size:24px}
.rules-card p{margin:0;font-size:16px;line-height:1.5;color:#5a557e;font-weight:700}
.rules-demo{display:flex;justify-content:center;gap:4px;margin:16px 0 4px}
.rules-demo span{width:26px;height:26px;font-size:26px}
.rules-demo span.burnDemo{animation:demoBurn 2.2s ease-in-out infinite}
@keyframes demoBurn{0%,45%{transform:scale(1);filter:none;opacity:1}55%{transform:scale(1.18);filter:brightness(1.6)}70%,85%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

/* game */
#game{padding-left:10px;padding-right:10px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.hud{width:var(--bs);display:flex;align-items:center;gap:8px;padding-top:10px;flex:none}
.pill{flex:1;background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:0}
.pill small{font-size:10.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.pill b{font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.pill.best b{color:#ff8a3d}
.pill.score b.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.petrow{position:relative;width:var(--bs);height:var(--ph,96px);flex:none;display:flex;align-items:flex-end;margin-top:auto;padding-top:4px}
.gpet{position:relative;height:100%;aspect-ratio:200/206;flex:none;cursor:pointer;z-index:2}
.gpet .pet{width:100%;height:100%;transform-origin:50% 95%;animation:idleBob 2.6s ease-in-out infinite}
.gpet.hop .pet{animation:hop .55s cubic-bezier(.3,1.4,.5,1)}
.gpet.party .pet{animation:party .9s cubic-bezier(.3,1.4,.5,1)}
.bubble{position:relative;margin:0 0 calc(var(--ph,96px)*.42) 8px;background:#fff;border-radius:18px 18px 18px 6px;padding:9px 14px;font-size:15px;box-shadow:var(--shadow-sm);max-width:62%;opacity:0;transform:translateY(6px) scale(.9);transform-origin:0 100%;transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.bubble.show{opacity:1;transform:none}
.bubble::before{content:'';position:absolute;left:-6px;bottom:6px;width:12px;height:12px;background:#fff;transform:rotate(45deg);border-radius:2px}
.board{position:relative;width:var(--bs);height:var(--bs);flex:none;padding:var(--pad);border-radius:calc(var(--bs)*.065);background:linear-gradient(180deg,#ffffff,#f7f5ff);box-shadow:var(--shadow),inset 0 0 0 1px rgba(160,140,255,.12);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:var(--gap);touch-action:none;margin-top:2px}
.cell{position:relative;border-radius:26%;background:#efedfb;box-shadow:inset 0 2px 3px rgba(90,80,170,.08)}
.cell.intro{animation:cellIn .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes cellIn{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
.blk{--c:#ff6b6b;--l:#ff9a8b;--d:#e04848;position:relative;border-radius:26%;font-size:var(--cs);
  background:linear-gradient(165deg,var(--l) 0%,var(--c) 52%,var(--d) 100%);
  box-shadow:inset 0 -.09em 0 rgba(0,0,0,.13),inset 0 .055em 0 rgba(255,255,255,.5),0 .05em .09em rgba(60,50,120,.2)}
.blk::after{content:'';position:absolute;left:15%;top:11%;width:36%;height:21%;border-radius:50%;background:rgba(255,255,255,.72);transform:rotate(-18deg)}
.blk::before{content:'';position:absolute;right:14%;bottom:18%;width:12%;height:12%;border-radius:50%;background:rgba(255,255,255,.35)}
.cell.blk{box-shadow:inset 0 -.09em 0 rgba(0,0,0,.13),inset 0 .055em 0 rgba(255,255,255,.5),0 .05em .09em rgba(60,50,120,.2)}
.cell.ghost{opacity:.42}
.cell.hl{animation:hlPulse .6s ease-in-out infinite alternate;z-index:1}
@keyframes hlPulse{0%{filter:brightness(1.05) saturate(1.1);transform:scale(1)}100%{filter:brightness(1.22) saturate(1.2);transform:scale(1.05)}}
.cell.pop{animation:squash .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes squash{0%{transform:scale(1.18,.78)}45%{transform:scale(.9,1.12)}75%{transform:scale(1.04,.97)}100%{transform:none}}
.board.dim .cell.blk{filter:saturate(.35) brightness(1.05);transition:filter .6s}

.fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.burn{position:absolute;width:var(--cs);height:var(--cs);animation:burn .55s cubic-bezier(.4,0,.6,1) both}
@keyframes burn{0%{transform:scale(1);filter:brightness(1)}25%{transform:scale(1.22);filter:brightness(1.75) saturate(1.3)}45%{transform:scale(1.12) rotate(6deg);filter:brightness(2.2);opacity:1}100%{transform:scale(0) rotate(30deg);opacity:0;filter:brightness(2.4)}}
.flash{position:absolute;width:var(--cs);height:var(--cs);border-radius:30%;background:radial-gradient(circle,#fff 0%,rgba(255,250,210,.9) 40%,rgba(255,220,120,0) 72%);animation:flash .5s ease-out both}
@keyframes flash{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.5);opacity:1}100%{transform:scale(2.1);opacity:0}}
.ptc{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;animation:ptc .75s cubic-bezier(.15,.7,.4,1) both}
.ptc.star{width:14px;height:14px;margin:-7px 0 0 -7px}
@keyframes ptc{0%{transform:translate(0,0) scale(.6) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(var(--rot));opacity:0}}
.ftxt{position:absolute;transform:translate(-50%,-50%);font-size:clamp(22px,6.5vw,30px);color:#fff;-webkit-text-stroke:0;text-shadow:0 2px 0 #7c6cff,0 -2px 0 #7c6cff,2px 0 0 #7c6cff,-2px 0 0 #7c6cff,0 4px 8px rgba(80,60,200,.35);animation:ftxt 1s cubic-bezier(.2,.8,.3,1) both;white-space:nowrap;z-index:6}
@keyframes ftxt{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:7;pointer-events:none;animation:banner 1.25s cubic-bezier(.2,.9,.3,1) both}
.banner b{font-size:clamp(30px,9vw,42px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 var(--bc,#ff7ac6),0 -3px 0 var(--bc,#ff7ac6),3px 0 0 var(--bc,#ff7ac6),-3px 0 0 var(--bc,#ff7ac6),2px 2px 0 var(--bc,#ff7ac6),-2px -2px 0 var(--bc,#ff7ac6),2px -2px 0 var(--bc,#ff7ac6),-2px 2px 0 var(--bc,#ff7ac6),0 8px 16px rgba(80,60,200,.3)}
.banner small{margin-top:4px;font-size:16px;background:#fff;color:var(--bc,#ff7ac6);border-radius:12px;padding:3px 10px;box-shadow:var(--shadow-sm)}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:20px;padding:14px 20px;box-shadow:var(--shadow);font-size:18px;z-index:8;white-space:nowrap;animation:toast .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.tray{position:relative;width:var(--bs);height:var(--th,130px);flex:none;display:flex;gap:8px;margin-top:10px;margin-bottom:auto;touch-action:none}
.slot{flex:1;position:relative;border-radius:24px;background:rgba(255,255,255,.65);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.slot.nofit .piece{filter:grayscale(.85) opacity(.45)}
.slot.dragging .piece{visibility:hidden}
.piece{position:relative;pointer-events:none}
.piece .blk{position:absolute}
.slot .piece.in{animation:pieceIn .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pieceIn{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:left,top,transform}
.drag .blk{box-shadow:inset 0 -.09em 0 rgba(0,0,0,.13),inset 0 .055em 0 rgba(255,255,255,.5),0 .14em .22em rgba(60,50,120,.28)}

/* end */
.end-wrap{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%;text-align:center}
.end-pet{position:relative;width:min(50vw,200px);aspect-ratio:200/206}
.end-pet .pet{width:100%;height:100%;animation:cheer 1.1s cubic-bezier(.3,1.4,.5,1) infinite;transform-origin:50% 95%}
.end-wrap h2{margin:12px 0 4px;font-size:40px;letter-spacing:-.5px}
.newrec{display:inline-block;margin-top:2px;padding:5px 12px;border-radius:12px;background:linear-gradient(180deg,#ffd76a,#ffb22e);color:#7a4a00;font-size:14px;box-shadow:0 4px 10px rgba(255,170,40,.35);animation:bump 1s ease-in-out infinite}
.end-stats{display:flex;gap:10px;margin:16px 0 22px;width:100%;max-width:340px}
.end-stats .pill{padding:12px}
.end-stats .pill b{font-size:28px}
.end-btns{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:conf linear infinite}
@keyframes conf{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}

/* pets */
.pet .eh{display:none}
.pet .eo{transform-box:fill-box;transform-origin:50% 55%;animation:blink 4.2s infinite}
.pet.happy .eo{display:none}
.pet.happy .eh{display:inline}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes idleBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(.99,1.01)}}
@keyframes hop{0%{transform:none}25%{transform:translateY(2%) scale(1.08,.9)}55%{transform:translateY(-16%) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes party{0%{transform:none}15%{transform:translateY(3%) scale(1.1,.88)}40%{transform:translateY(-24%) rotate(-8deg) scale(.95,1.07)}60%{transform:translateY(-24%) rotate(8deg)}82%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes cheer{0%,100%{transform:none}20%{transform:translateY(2%) scale(1.06,.93)}50%{transform:translateY(-12%) scale(.97,1.04) rotate(-3deg)}75%{transform:translateY(0) scale(1.03,.97) rotate(2deg)}}
.sparkle{position:absolute;pointer-events:none;width:22px;height:22px;animation:sparkle .9s ease-out both;z-index:3}
@keyframes sparkle{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0}30%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5)) scale(1.1) rotate(60deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(140deg);opacity:0}}

@media (max-height:700px){.hud{padding-top:6px}.pill b{font-size:19px}.picker button{width:56px;height:56px}.btn{height:52px}}
@media (prefers-reduced-motion:reduce){.bgdeco i{animation:none}}

<body>
<div id="app">
  <div class="bgdeco" id="bgdeco"></div>

  <section class="screen" id="menu">
    <div class="topbar"><span style="width:44px"></span><span></span><button class="iconbtn sndbtn" aria-label="Звук"></button></div>
    <div class="logo"><div class="tiles" id="logoTiles"></div><h1>Сложи блоки</h1></div>
    <div class="menu-pet" id="menuPet"></div>
    <div class="petname" id="petName"></div>
    <div class="picker-title">Выбери питомца</div>
    <div class="picker" id="picker"></div>
    <div class="bestline">🏆 Рекорд: <b id="menuBest">0</b></div>
    <div class="menu-btns" id="menuBtns"></div>
  </section>

  <section class="screen" id="rules">
    <div class="topbar"><button class="iconbtn" id="rulesBack" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#3a3560" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span></span><button class="iconbtn sndbtn" aria-label="Звук"></button></div>
    <div class="rules-wrap">
      <div class="rules-pet" id="rulesPet"></div>
      <div class="rules-card">
        <h2>Как играть</h2>
        <p>Перетаскивай фигуры на поле. Заполни ряд или столбец — он сгорит и даст очки.</p>
        <div class="rules-demo" id="rulesDemo"></div>
        <p style="font-size:14px;color:#8a86a8">Игра закончится, когда фигуры больше не влезут.</p>
      </div>
    </div>
    <div class="menu-btns"><button class="btn green" id="startBtn">Начать</button></div>
  </section>

  <section class="screen" id="game">
    <div class="hud">
      <button class="iconbtn" id="gameBack" aria-label="В меню"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#3a3560" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="pill score"><small>Счёт</small><b id="score">0</b></div>
      <div class="pill best"><small>Рекорд</small><b id="best">0</b></div>
      <button class="iconbtn sndbtn" aria-label="Звук"></button>
    </div>
    <div class="petrow"><div class="gpet" id="gpet"></div><div class="bubble" id="bubble"></div></div>
    <div class="board" id="board"><div class="fx" id="fx"></div></div>
    <div class="tray" id="tray"><div class="slot" data-i="0"></div><div class="slot" data-i="1"></div><div class="slot" data-i="2"></div></div>
  </section>

  <section class="screen" id="end">
    <div class="confetti" id="confetti"></div>
    <div class="end-wrap">
      <div class="end-pet" id="endPet"></div>
      <h2>Готово</h2>
      <div id="newRec"></div>
      <div class="end-stats">
        <div class="pill score"><small>Счёт</small><b id="endScore">0</b></div>
        <div class="pill best"><small>Рекорд</small><b id="endBest">0</b></div>
      </div>
      <div class="end-btns">
        <button class="btn primary" id="againBtn">Ещё раз</button>
        <button class="btn soft" id="toMenuBtn">В меню</button>
      </div>
    </div>
  </section>
</div>

<script>

var Logic = (function () {

  }

  add(['XX'], 3, 'line', true);
  add(['XXX'], 3.6, 'line', true);
  add(['XXXX'], 3, 'line', true);
  add(['XXXXX'], 2, 'line', true);
  add(['XX', 'XX'], 3, 'sq');
  add(['XXX', 'XXX', 'XXX'], 1.4, 'big');
  add(['XXX', 'XXX'], 1.8, 'rect', true);
  add(['XX', 'X.'], 4, 'corner', true);
  add(['X..', 'X..', 'XXX'], 2, 'big', true);
  add(['X.', 'X.', 'XX'], 2.6, 'L', true);
  add(['.X', '.X', 'XX'], 2.6, 'L', true);
  add(['XXX', '.X.'], 2.6, 'T', true);

  }
  function anyMove(state) {

  }

  function applyMove(state, ti, r, c, rnd) {

  }
